      - name: Persist Discord message IDs
        run: |
          if git diff --quiet -- data/discord_state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nur die neue State-Datei sichern
          cp data/discord_state.json /tmp/discord_state.json

          # Aktuellen Stand von main holen
          git fetch origin main
          git reset --hard origin/main

          # Neue State-Datei wieder einsetzen
          cp /tmp/discord_state.json data/discord_state.json

          git add data/discord_state.json

          if git diff --cached --quiet; then
            echo "No state changes after sync."
            exit 0
          fi

          git commit -m "chore: store Discord source message IDs"
          git push origin HEAD:main
